name: Monitor 売る前診断 live site

on:
  push:
    branches:
      - main
    paths:
      - 'uru-mae-shindan/**'
      - '.github/workflows/monitor-uru-mae-shindan.yml'
  schedule:
    - cron: '17 21 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor-live-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check public pages and discovery files
        shell: bash
        run: |
          set -euo pipefail
          base="https://flhworks.github.io/flh.works/uru-mae-shindan"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          check_until_ready() {
            local url="$1"
            local output="$2"
            local marker="$3"
            local status=""
            for attempt in $(seq 1 24); do
              status="$(curl --silent --show-error --location --output "$output" --write-out '%{http_code}' "$url" || true)"
              echo "attempt=${attempt} url=${url} status=${status}"
              if [[ "$status" == "200" ]] && grep -Fq "$marker" "$output"; then
                return 0
              fi
              sleep 10
            done
            echo "ERROR: ${url} did not return expected content" >&2
            return 1
          }

          assert_no_affiliate() {
            local file="$1"
            grep -Fq '現在、このページには広告・アフィリエイトリンクを掲載していません' "$file"
            if grep -Eq 'a8mat=|px[.]a8[.]net|www[0-9]+[.]a8[.]net/0[.]gif|tel:' "$file"; then
              echo "ERROR: affiliate or telephone marker found in expected ad-free page: $file" >&2
              return 1
            fi
          }

          check_until_ready "$base/" "$tmp/index.html" '売る前診断'
          check_until_ready "$base/instrument-selling.html" "$tmp/instrument.html" '4BAE5C+EFRFW2+5VHC+5YJRM'
          check_until_ready "$base/instrument-assessment-check.html" "$tmp/assessment.html" 'instrument-affiliate-template'
          check_until_ready "$base/smartphone-pc-selling.html" "$tmp/smartphone-pc.html" '4BAEXC+G7GTMA+1SOW+ZQFQA'
          check_until_ready "$base/smartphone-data-erasure-before-selling.html" "$tmp/smartphone-data.html" '4BAEXC+G7GTMA+1SOW+ZQFQA'
          check_until_ready "$base/smartphone-pc-assessment-check.html" "$tmp/smartphone-pc-check.html" 'スマホ・パソコン買取の査定前チェック'
          check_until_ready "$base/camera-selling.html" "$tmp/camera.html" 'カメラ・レンズを売る前に'
          check_until_ready "$base/books-hobby-selling.html" "$tmp/books-hobby.html" '4BAEXC+G6VE0I+2P0S+BZ0Z6'
          check_until_ready "$base/figure-purchase-cancellation-check.html" "$tmp/figure-cancel.html" '4BAEXC+G6VE0I+2P0S+BZ0Z6'
          check_until_ready "$base/books-hobby-assessment-check.html" "$tmp/books-hobby-check.html" '本・ゲーム・フィギュア買取の査定前チェック'
          check_until_ready "$base/brand-watch-selling.html" "$tmp/brand-watch.html" 'ブランド品・時計を売る前に'
          check_until_ready "$base/kimono-clothing-selling.html" "$tmp/kimono-clothing.html" '着物・衣類を売る前に'
          check_until_ready "$base/kimono-clothing-assessment-check.html" "$tmp/kimono-clothing-check.html" '着物・衣類買取の査定前チェック'
          check_until_ready "$base/home-purchase.html" "$tmp/home-purchase.html" '申込み前に確認する8項目'
          check_until_ready "$base/assets/assessment-check.js" "$tmp/assessment.js" "method === 'visit'"
          check_until_ready "$base/assets/category-precheck.js" "$tmp/category-precheck.js" "dataset.level === 'stop'"
          check_until_ready "$base/advertising-policy.html" "$tmp/advertising-policy.html" '現在、一部ページでアフィリエイト広告を利用しています。'
          check_until_ready "$base/sources.html" "$tmp/sources.html" 'スマートフォンのデータ消去'
          check_until_ready "$base/sitemap.xml" "$tmp/sitemap.xml" 'instrument-assessment-check.html'

          unknown_status="$(curl --silent --show-error --location --output "$tmp/unknown.html" --write-out '%{http_code}' "$base/__scheduled_monitor_missing_page__" || true)"
          echo "unknown_path_status=${unknown_status}"
          [[ "$unknown_status" == "404" ]]

          grep -Fq 'instrument-selling.html' "$tmp/sitemap.xml"
          grep -Fq 'instrument-assessment-check.html' "$tmp/sitemap.xml"
          grep -Fq 'smartphone-pc-selling.html' "$tmp/sitemap.xml"
          grep -Fq 'smartphone-data-erasure-before-selling.html' "$tmp/sitemap.xml"
          grep -Fq 'smartphone-pc-assessment-check.html' "$tmp/sitemap.xml"
          grep -Fq 'camera-selling.html' "$tmp/sitemap.xml"
          grep -Fq 'books-hobby-selling.html' "$tmp/sitemap.xml"
          grep -Fq 'figure-purchase-cancellation-check.html' "$tmp/sitemap.xml"
          grep -Fq 'books-hobby-assessment-check.html' "$tmp/sitemap.xml"
          grep -Fq 'brand-watch-selling.html' "$tmp/sitemap.xml"
          grep -Fq 'kimono-clothing-selling.html' "$tmp/sitemap.xml"
          grep -Fq 'kimono-clothing-assessment-check.html' "$tmp/sitemap.xml"
          grep -Fq 'home-purchase.html' "$tmp/sitemap.xml"
          grep -Fq '広告・PRについて' "$tmp/assessment.html"
          grep -Fq 'smartphone-pc-assessment-check.html' "$tmp/smartphone-pc.html"
          grep -Fq 'smartphone-data-erasure-before-selling.html' "$tmp/smartphone-pc.html"
          grep -Fq 'books-hobby-assessment-check.html' "$tmp/books-hobby.html"
          grep -Fq 'figure-purchase-cancellation-check.html' "$tmp/books-hobby.html"
          grep -Fq 'kimono-clothing-assessment-check.html' "$tmp/kimono-clothing.html"
          grep -Fq 'smartphone-pc-selling.html' "$tmp/smartphone-pc-check.html"
          grep -Fq 'books-hobby-selling.html' "$tmp/books-hobby-check.html"
          grep -Fq 'kimono-clothing-selling.html' "$tmp/kimono-clothing-check.html"
          assert_no_affiliate "$tmp/smartphone-pc-check.html"
          assert_no_affiliate "$tmp/books-hobby-check.html"
          assert_no_affiliate "$tmp/kimono-clothing.html"
          assert_no_affiliate "$tmp/kimono-clothing-check.html"
          assert_no_affiliate "$tmp/home-purchase.html"
          grep -Fq 'https://www.kokusen.go.jp/t_box/data/t_box-faq_qa2016_13.html' "$tmp/home-purchase.html"
          if grep -Eq 'fetch[(]|XMLHttpRequest|sendBeacon' "$tmp/category-precheck.js"; then
            echo 'ERROR: category precheck script contains an external-send API' >&2
            exit 1
          fi
          grep -Fq '4BAE5C+EFRFW2+5VHC+5YJRM' "$tmp/instrument.html"
          grep -Fq '4BAE5C+EFRFW2+5VHC+5YJRM' "$tmp/assessment.html"
          grep -Fq "method === 'visit'" "$tmp/assessment.js"
          grep -Fq '4BAE5D+5E3BZM+35HU+1THW9E' "$tmp/camera.html"
          grep -Fq '4BAE5D+5FVMSY+56WW+5YRHE' "$tmp/brand-watch.html"
          grep -Fq 'https://px.a8.net/svt/ejp?a8mat=4BAEXC+G7GTMA+1SOW+ZQFQA' "$tmp/smartphone-pc.html"
          grep -Fq 'https://www12.a8.net/0.gif?a8mat=4BAEXC+G7GTMA+1SOW+ZQFQA' "$tmp/smartphone-pc.html"
          grep -Fq 'https://px.a8.net/svt/ejp?a8mat=4BAEXC+G7GTMA+1SOW+ZQFQA' "$tmp/smartphone-data.html"
          grep -Fq 'https://www12.a8.net/0.gif?a8mat=4BAEXC+G7GTMA+1SOW+ZQFQA' "$tmp/smartphone-data.html"
          grep -Fq 'smartphone-pc-selling.html' "$tmp/smartphone-data.html"
          grep -Fq 'https://px.a8.net/svt/ejp?a8mat=4BAEXC+G6VE0I+2P0S+BZ0Z6' "$tmp/books-hobby.html"
          grep -Fq 'https://www14.a8.net/0.gif?a8mat=4BAEXC+G6VE0I+2P0S+BZ0Z6' "$tmp/books-hobby.html"
          grep -Fq 'https://px.a8.net/svt/ejp?a8mat=4BAEXC+G6VE0I+2P0S+BZ0Z6' "$tmp/figure-cancel.html"
          grep -Fq 'https://www14.a8.net/0.gif?a8mat=4BAEXC+G6VE0I+2P0S+BZ0Z6' "$tmp/figure-cancel.html"
          grep -Fq 'books-hobby-selling.html' "$tmp/figure-cancel.html"
          grep -Fq '広告・PRについて' "$tmp/smartphone-pc.html"
          grep -Fq '広告・PRについて' "$tmp/books-hobby.html"
          grep -Fq '広告・PRについて' "$tmp/smartphone-data.html"
          grep -Fq '広告・PRについて' "$tmp/figure-cancel.html"
          grep -Fq 'https://support.apple.com/ja-jp/109511' "$tmp/smartphone-data.html"
          grep -Fq 'https://support.google.com/android/answer/6088915?hl=ja' "$tmp/smartphone-data.html"
          grep -Fq 'https://figurekaitori.net/faq/' "$tmp/figure-cancel.html"
          grep -Fq 'https://support.apple.com/ja-jp/109511' "$tmp/sources.html"
          grep -Fq 'https://figurekaitori.net/faq/' "$tmp/sources.html"
          if grep -Eq 'tel:' "$tmp/smartphone-pc.html" "$tmp/books-hobby.html" "$tmp/smartphone-data.html" "$tmp/figure-cancel.html"; then
            echo 'ERROR: telephone link found on new affiliate guide' >&2
            exit 1
          fi

          echo 'URU_MAE_SHINDAN_MONITOR=PASS'
