name: Monitor 売る前診断 live site

on:
  push:
    branches:
      - main
    paths:
      - 'uru-mae-shindan/**'
      - '.github/workflows/monitor-uru-mae-shindan.yml'
  schedule:
    - cron: '17 21 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor-live-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check public pages and discovery files
        shell: bash
        run: |
          set -euo pipefail
          base="https://flhworks.github.io/flh.works/uru-mae-shindan"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          check_until_ready() {
            local url="$1"
            local output="$2"
            local marker="$3"
            local status=""
            for attempt in $(seq 1 24); do
              status="$(curl --silent --show-error --location --output "$output" --write-out '%{http_code}' "$url" || true)"
              echo "attempt=${attempt} url=${url} status=${status}"
              if [[ "$status" == "200" ]] && grep -Fq "$marker" "$output"; then
                return 0
              fi
              sleep 10
            done
            echo "ERROR: ${url} did not return expected content" >&2
            return 1
          }

          check_until_ready "$base/" "$tmp/index.html" '売る前診断'
          check_until_ready "$base/instrument-selling.html" "$tmp/instrument.html" '楽器・機材を売る前に'
          check_until_ready "$base/instrument-assessment-check.html" "$tmp/assessment.html" '楽器買取の無料査定前チェック'
          check_until_ready "$base/smartphone-pc-selling.html" "$tmp/smartphone-pc.html" 'スマートフォン・パソコンを売る前に'
          check_until_ready "$base/camera-selling.html" "$tmp/camera.html" 'カメラ・レンズを売る前に'
          check_until_ready "$base/books-hobby-selling.html" "$tmp/books-hobby.html" '本・ゲーム・ホビーを売る前に'
          check_until_ready "$base/brand-watch-selling.html" "$tmp/brand-watch.html" 'ブランド品・時計を売る前に'
          check_until_ready "$base/kimono-clothing-selling.html" "$tmp/kimono-clothing.html" '着物・衣類を売る前に'
          check_until_ready "$base/assets/assessment-check.js" "$tmp/assessment.js" 'new FormData(form)'
          check_until_ready "$base/sitemap.xml" "$tmp/sitemap.xml" 'instrument-assessment-check.html'

          unknown_status="$(curl --silent --show-error --location --output "$tmp/unknown.html" --write-out '%{http_code}' "$base/__scheduled_monitor_missing_page__" || true)"
          echo "unknown_path_status=${unknown_status}"
          [[ "$unknown_status" == "404" ]]

          grep -Fq 'instrument-selling.html' "$tmp/sitemap.xml"
          grep -Fq 'instrument-assessment-check.html' "$tmp/sitemap.xml"
          grep -Fq 'smartphone-pc-selling.html' "$tmp/sitemap.xml"
          grep -Fq 'camera-selling.html' "$tmp/sitemap.xml"
          grep -Fq 'books-hobby-selling.html' "$tmp/sitemap.xml"
          grep -Fq 'brand-watch-selling.html' "$tmp/sitemap.xml"
          grep -Fq 'kimono-clothing-selling.html' "$tmp/sitemap.xml"
          grep -Fq '広告について' "$tmp/assessment.html"
          grep -Fq '現在、このページには広告・アフィリエイトリンクを掲載していません' "$tmp/smartphone-pc.html"
          grep -Fq '現在、このページには広告・アフィリエイトリンクを掲載していません' "$tmp/camera.html"
          grep -Fq '現在、このページには広告・アフィリエイトリンクを掲載していません' "$tmp/books-hobby.html"
          grep -Fq '現在、このページには広告・アフィリエイトリンクを掲載していません' "$tmp/brand-watch.html"
          grep -Fq '現在、このページには広告・アフィリエイトリンクを掲載していません' "$tmp/kimono-clothing.html"

          echo 'URU_MAE_SHINDAN_MONITOR=PASS'
