name: Materialize remaining high-intent ad-free pages

on:
  push:
    branches:
      - aff/high-intent-adfree-batch2-20260902
    paths:
      - '.github/workflows/materialize-remaining3-adfree.yml'

permissions:
  contents: write

jobs:
  materialize-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch with full history
        uses: actions/checkout@v4
        with:
          ref: aff/high-intent-adfree-batch2-20260902
          fetch-depth: 0

      - name: Verify exact main baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "cf8bd85d6c7b87256e42e52e31cae02ba62d3da5"
          test "$(git merge-base HEAD origin/main)" = "cf8bd85d6c7b87256e42e52e31cae02ba62d3da5"
          test "$(git hash-object uru-mae-shindan/instrument-selling.html)" = "cc594ac348ec581e1d91d667d313307ddc914be7"
          test "$(git hash-object uru-mae-shindan/brand-watch-selling.html)" = "7dfe13712ae84e9e5febd79107bd1fbfa4ded49d"
          test "$(git hash-object uru-mae-shindan/figure-purchase-cancellation-check.html)" = "f8f5b4af8ef7b91b4bec1c1c0b8d689514cbcf19"
          test "$(git hash-object uru-mae-shindan/sitemap.xml)" = "c55310dd5b33eb5c8e221bfab0993cfa2921ac16"
          test "$(git hash-object uru-mae-shindan/assets/high-intent.css)" = "80f7476c5bdc67e097d6d01a0c202b675dd8353e"
          test ! -e uru-mae-shindan/instrument-operation-check-before-selling.html
          test ! -e uru-mae-shindan/brand-watch-accessories-repair-history-check.html
          test ! -e uru-mae-shindan/figure-box-parts-condition-check.html

      - name: Materialize reviewed pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/flhworks/flh.works/git/blobs/274a0f1c8e627661e38a3d2f57e580180878f85b" \
            | jq -r '.content' | tr -d '\n' | base64 --decode > /tmp/remaining3.tgz
          echo 'c8889424a2595221be8b002bb1b5ccbcb26dbc913d83fca803e8225a628a4ffe  /tmp/remaining3.tgz' | sha256sum -c -
          tar -xzf /tmp/remaining3.tgz -C .

      - name: Connect parent pages and sitemap transactionally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          date = '2026-09-02'
          parents = [
              {
                  'path': 'uru-mae-shindan/instrument-selling.html',
                  'slug': 'instrument-operation-check-before-selling.html',
                  'anchor': '      <h2>買取申込み前に確認すること</h2>',
                  'block': '      <div class="callout callout-blue" data-high-intent-link="instrument-operation-check-before-selling.html"><strong>動作確認を同じ順番で記録</strong><br>ギター・ベース、アンプ、エフェクターの型番・電源・入出力・不具合を「正常／不具合あり／未確認」に分けて整理できます。<div class="hero-actions"><a class="button button-secondary" href="instrument-operation-check-before-selling.html">詳しいチェックを見る</a></div></div>\n\n',
                  'href': 'https://px.a8.net/svt/ejp?a8mat=4BAE5C+EFRFW2+5VHC+5YJRM',
                  'pixel': 'https://www18.a8.net/0.gif?a8mat=4BAE5C+EFRFW2+5VHC+5YJRM',
              },
              {
                  'path': 'uru-mae-shindan/brand-watch-selling.html',
                  'slug': 'brand-watch-accessories-repair-history-check.html',
                  'anchor': '      <h2>買取申込み前に確認すること</h2>',
                  'block': '      <div class="callout callout-blue" data-high-intent-link="brand-watch-accessories-repair-history-check.html"><strong>箱・保証書・余りコマ・修理歴を整理</strong><br>本体だけでなく、付属品、修理・電池交換、刻印、交換部品を確認できた範囲で記録できます。<div class="hero-actions"><a class="button button-secondary" href="brand-watch-accessories-repair-history-check.html">詳しいチェックを見る</a></div></div>\n\n',
                  'href': 'https://px.a8.net/svt/ejp?a8mat=4BAE5D+5FVMSY+56WW+5YRHE',
                  'pixel': 'https://www15.a8.net/0.gif?a8mat=4BAE5D+5FVMSY+56WW+5YRHE',
              },
              {
                  'path': 'uru-mae-shindan/figure-purchase-cancellation-check.html',
                  'slug': 'figure-box-parts-condition-check.html',
                  'anchor': '      <h2>確認に使った公式情報</h2>',
                  'block': '      <div class="callout callout-blue" data-high-intent-link="figure-box-parts-condition-check.html"><strong>箱・付属品・欠品・状態を先に整理</strong><br>外箱、ブリスター、台座、交換パーツ、説明書、特典、破損、におい等を商品ごとに確認できます。<div class="hero-actions"><a class="button button-secondary" href="figure-box-parts-condition-check.html">詳しいチェックを見る</a></div></div>\n\n',
                  'href': 'https://px.a8.net/svt/ejp?a8mat=4BAEXC+G6VE0I+2P0S+BZ0Z6',
                  'pixel': 'https://www14.a8.net/0.gif?a8mat=4BAEXC+G6VE0I+2P0S+BZ0Z6',
              },
          ]

          for cfg in parents:
              path = Path(cfg['path'])
              text = path.read_text(encoding='utf-8')
              before_href = text.count(cfg['href'])
              before_pixel = text.count(cfg['pixel'])
              if (before_href, before_pixel) != (1, 1):
                  raise SystemExit(f"A8 marker mismatch before edit: {cfg['path']} href={before_href} pixel={before_pixel}")
              if text.count(cfg['anchor']) != 1 or cfg['slug'] in text:
                  raise SystemExit(f"parent anchor mismatch or page already linked: {cfg['path']}")
              text = text.replace(cfg['anchor'], cfg['block'] + cfg['anchor'], 1)
              text, date_count = re.subn(r'"dateModified":"\d{4}-\d{2}-\d{2}"', f'"dateModified":"{date}"', text, count=1)
              if date_count != 1:
                  raise SystemExit(f"dateModified mismatch: {cfg['path']}")
              text, footer_count = re.subn(r'情報確認日：\d{4}年\d{1,2}月\d{1,2}日', '情報確認日：2026年9月2日', text, count=1)
              if footer_count != 1:
                  raise SystemExit(f"footer date mismatch: {cfg['path']}")
              if text.count(cfg['href']) != before_href or text.count(cfg['pixel']) != before_pixel:
                  raise SystemExit(f"A8 marker changed: {cfg['path']}")
              path.write_text(text, encoding='utf-8')

          sitemap = Path('uru-mae-shindan/sitemap.xml')
          xml = sitemap.read_text(encoding='utf-8')
          before_count = xml.count('<url>')
          entries = [
              ('instrument-selling.html', 'instrument-operation-check-before-selling.html'),
              ('brand-watch-selling.html', 'brand-watch-accessories-repair-history-check.html'),
              ('figure-purchase-cancellation-check.html', 'figure-box-parts-condition-check.html'),
          ]
          for parent, slug in entries:
              if slug in xml:
                  raise SystemExit(f'sitemap already contains {slug}')
              parent_url = 'https://flhworks.github.io/flh.works/uru-mae-shindan/' + parent
              pattern = re.compile(r'  <url><loc>' + re.escape(parent_url) + r'</loc><lastmod>\d{4}-\d{2}-\d{2}</lastmod><changefreq>([^<]+)</changefreq><priority>([^<]+)</priority></url>\n')
              match = pattern.search(xml)
              if not match:
                  raise SystemExit(f'sitemap parent not found: {parent}')
              parent_line = f'  <url><loc>{parent_url}</loc><lastmod>{date}</lastmod><changefreq>{match.group(1)}</changefreq><priority>{match.group(2)}</priority></url>\n'
              new_url = 'https://flhworks.github.io/flh.works/uru-mae-shindan/' + slug
              new_line = f'  <url><loc>{new_url}</loc><lastmod>{date}</lastmod><changefreq>monthly</changefreq><priority>0.9</priority></url>\n'
              xml = xml[:match.start()] + parent_line + new_line + xml[match.end():]
          if xml.count('<url>') != before_count + 3:
              raise SystemExit('sitemap URL count mismatch')
          for _, slug in entries:
              if xml.count(slug) != 1:
                  raise SystemExit(f'sitemap slug count mismatch: {slug}')
          sitemap.write_text(xml, encoding='utf-8')
          PY

      - name: Run static SEO and local HTTP checks
        shell: bash
        run: |
          set -euo pipefail
          pages=(
            instrument-operation-check-before-selling.html
            brand-watch-accessories-repair-history-check.html
            figure-box-parts-condition-check.html
          )
          for name in "${pages[@]}"; do
            page="uru-mae-shindan/$name"
            test -f "$page"
            grep -Fq 'content="index,follow,max-image-preview:large" name="robots"' "$page"
            grep -Fq 'assets/high-intent.css' "$page"
            ! grep -Eq 'noindex|非公開候補|a8mat=|px[.]a8[.]net|www[0-9]+[.]a8[.]net/0[.]gif' "$page"
            test "$(grep -Fo "$name" uru-mae-shindan/sitemap.xml | wc -l)" -eq 1
          done
          test "$(grep -Fo 'instrument-operation-check-before-selling.html' uru-mae-shindan/instrument-selling.html | wc -l)" -eq 2
          test "$(grep -Fo 'brand-watch-accessories-repair-history-check.html' uru-mae-shindan/brand-watch-selling.html | wc -l)" -eq 2
          test "$(grep -Fo 'figure-box-parts-condition-check.html' uru-mae-shindan/figure-purchase-cancellation-check.html | wc -l)" -eq 2
          test "$(grep -Fo 'https://px.a8.net/svt/ejp?a8mat=4BAE5C+EFRFW2+5VHC+5YJRM' uru-mae-shindan/instrument-selling.html | wc -l)" -eq 1
          test "$(grep -Fo 'https://www18.a8.net/0.gif?a8mat=4BAE5C+EFRFW2+5VHC+5YJRM' uru-mae-shindan/instrument-selling.html | wc -l)" -eq 1
          test "$(grep -Fo 'https://px.a8.net/svt/ejp?a8mat=4BAE5D+5FVMSY+56WW+5YRHE' uru-mae-shindan/brand-watch-selling.html | wc -l)" -eq 1
          test "$(grep -Fo 'https://www15.a8.net/0.gif?a8mat=4BAE5D+5FVMSY+56WW+5YRHE' uru-mae-shindan/brand-watch-selling.html | wc -l)" -eq 1
          test "$(grep -Fo 'https://px.a8.net/svt/ejp?a8mat=4BAEXC+G6VE0I+2P0S+BZ0Z6' uru-mae-shindan/figure-purchase-cancellation-check.html | wc -l)" -eq 1
          test "$(grep -Fo 'https://www14.a8.net/0.gif?a8mat=4BAEXC+G6VE0I+2P0S+BZ0Z6' uru-mae-shindan/figure-purchase-cancellation-check.html | wc -l)" -eq 1
          node .github/scripts/check-uru-mae-shindan-seo.mjs
          git diff --check
          python3 -m http.server 8765 --directory uru-mae-shindan >/tmp/remaining3-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          for name in "${pages[@]}"; do
            code="$(curl --silent --show-error --output "/tmp/$name" --write-out '%{http_code}' "http://127.0.0.1:8765/$name")"
            test "$code" = '200'
            grep -Fq '<h1' "/tmp/$name"
          done

      - name: Commit reviewed candidate files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-remaining3-adfree.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '楽器・時計・フィギュアの高意図ページを広告なしで追加'
          git push origin HEAD:aff/high-intent-adfree-batch2-20260902
