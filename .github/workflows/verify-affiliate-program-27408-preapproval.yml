name: Verify affiliate program 27408 preapproval

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
      - name: Verify eligibility-aligned static media
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse

          root = Path('uru-mae-shindan')
          html_files = sorted(root.glob('*.html'))
          assert len(html_files) == 14, len(html_files)

          instrument = (root / 'instrument-selling.html').read_text(encoding='utf-8')
          checklist = (root / 'checklist.html').read_text(encoding='utf-8')

          required_instrument = [
              '査定サービスの対象外を先に確認',
              'ピアノ関連、和楽器、オーディオ機器',
              'シンセサイザー',
              '過去利用、同一世帯の重複申込み等の条件',
              '現在、このページには広告・アフィリエイトリンクを掲載していません。',
              'dateModified":"2026-08-25"',
          ]
          for text in required_instrument:
              assert text in instrument, text

          assert '電子ピアノ・キーボード' not in instrument
          assert '<h2>楽器・DTM・DJ機材</h2>' in checklist
          assert '査定サービスごとに対象外があります。' in checklist
          assert '情報確認日：2026年8月25日' in instrument
          assert '情報確認日：2026年8月25日' in checklist

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == 'a' and values.get('href'):
                      self.links.append(values['href'])
                  if tag in ('link', 'script'):
                      ref = values.get('href') or values.get('src')
                      if ref:
                          self.links.append(ref)

          for page in html_files:
              parser = LinkParser()
              parser.feed(page.read_text(encoding='utf-8'))
              for href in parser.links:
                  if href.startswith(('#', 'mailto:', 'tel:')):
                      continue
                  parsed = urlparse(href)
                  if parsed.scheme in ('http', 'https'):
                      continue
                  target = (page.parent / parsed.path).resolve()
                  if parsed.path.endswith('/'):
                      target = target / 'index.html'
                  assert target.exists(), f'{page.name}: missing {href}'

          prohibited = ('px.a8.net', 'media-console.a8.net', 'programId=s00000027408001')
          for page in html_files:
              text = page.read_text(encoding='utf-8')
              for marker in prohibited:
                  assert marker not in text, f'{page.name}: found {marker}'

          print(f'STATIC_QA_PASS html={len(html_files)} eligibility_alignment=PASS ad_links=0')
          PY
          node --check uru-mae-shindan/assets/common.js
          node --check uru-mae-shindan/assets/diagnosis.js
          node --check uru-mae-shindan/assets/calculator.js
          echo NODE_JS_SYNTAX_PASS
