name: Verify affiliate site v1.1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
      - name: Verify static media package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          import xml.etree.ElementTree as ET

          root = Path('uru-mae-shindan')
          html_files = sorted(root.glob('*.html'))
          assert len(html_files) == 14, len(html_files)
          required = [
              'index.html','instrument-selling.html','checklist.html','compare.html',
              'flea-profit.html','home-purchase.html','visit-purchase.html','store-purchase.html',
              'about.html','editorial-policy.html','advertising-policy.html','privacy.html',
              'sources.html','404.html','robots.txt','sitemap.xml','assets/styles.css',
              'assets/category-guide.css','assets/common.js','assets/diagnosis.js',
              'assets/calculator.js','assets/favicon.svg'
          ]
          for rel in required:
              assert (root / rel).is_file(), rel

          index = (root / 'index.html').read_text(encoding='utf-8')
          guide = (root / 'instrument-selling.html').read_text(encoding='utf-8')
          checklist = (root / 'checklist.html').read_text(encoding='utf-8')
          robots = (root / 'robots.txt').read_text(encoding='utf-8')
          assert '楽器・機材のガイドを見る' in index
          assert 'assets/category-guide.css' in index
          assert 'ギター・ベース・アンプ・エフェクター' in guide
          assert '楽器・音響・DTM機材' in checklist
          assert 'Sitemap: https://flhworks.github.io/flh.works/uru-mae-shindan/sitemap.xml' in robots
          assert '現在、広告・アフィリエイトリンクは掲載していません。' in index

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == 'a' and values.get('href'):
                      self.links.append(values['href'])
                  if tag in ('link','script'):
                      ref = values.get('href') or values.get('src')
                      if ref:
                          self.links.append(ref)

          for page in html_files:
              parser = LinkParser()
              parser.feed(page.read_text(encoding='utf-8'))
              for href in parser.links:
                  if href.startswith(('#','mailto:','tel:')):
                      continue
                  parsed = urlparse(href)
                  if parsed.scheme in ('http','https'):
                      continue
                  target = (page.parent / parsed.path).resolve()
                  if parsed.path.endswith('/'):
                      target = target / 'index.html'
                  assert target.exists(), f'{page.name}: missing {href}'

          ns = {'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          tree = ET.parse(root / 'sitemap.xml')
          urls = tree.findall('.//sm:url', ns)
          assert len(urls) == 13, len(urls)
          locations = [u.find('sm:loc', ns).text for u in urls]
          assert 'https://flhworks.github.io/flh.works/uru-mae-shindan/instrument-selling.html' in locations
          print(f'STATIC_QA_PASS html={len(html_files)} sitemap_urls={len(urls)}')
          PY
          node --check uru-mae-shindan/assets/common.js
          node --check uru-mae-shindan/assets/diagnosis.js
          node --check uru-mae-shindan/assets/calculator.js
          echo NODE_JS_SYNTAX_PASS
