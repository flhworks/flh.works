name: Materialize smartphone ad-free canary

on:
  push:
    branches:
      - aff/smartphone-network-adfree-canary-20260902
    paths:
      - '.github/workflows/materialize-smartphone-adfree-canary.yml'

permissions:
  contents: write

jobs:
  materialize-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out branch with full history
        uses: actions/checkout@v4
        with:
          ref: aff/smartphone-network-adfree-canary-20260902
          fetch-depth: 0

      - name: Verify exact main baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "31fccf0772280ae8946124633204482bc4064f04"
          test "$(git merge-base HEAD origin/main)" = "31fccf0772280ae8946124633204482bc4064f04"
          test ! -e uru-mae-shindan/smartphone-network-restriction-before-selling.html
          test ! -e uru-mae-shindan/assets/high-intent.css

      - name: Materialize reviewed payload
        shell: bash
        env:
          PAYLOAD_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD_B64" | base64 --decode > /tmp/smartphone-canary.tgz
          tar -xzf /tmp/smartphone-canary.tgz -C .

      - name: Run static and SEO checks
        shell: bash
        run: |
          set -euo pipefail
          test -f uru-mae-shindan/smartphone-network-restriction-before-selling.html
          test -f uru-mae-shindan/assets/high-intent.css
          grep -Fq 'smartphone-network-restriction-before-selling.html' uru-mae-shindan/smartphone-pc-selling.html
          test "$(grep -Fo 'smartphone-network-restriction-before-selling.html' uru-mae-shindan/sitemap.xml | wc -l)" -eq 1
          ! grep -Eq 'noindex|非公開候補|a8mat=|px[.]a8[.]net|www[0-9]+[.]a8[.]net/0[.]gif' uru-mae-shindan/smartphone-network-restriction-before-selling.html
          test "$(grep -Fo 'https://px.a8.net/svt/ejp?a8mat=4BAEXC+G7GTMA+1SOW+ZQFQA' uru-mae-shindan/smartphone-pc-selling.html | wc -l)" -eq 1
          test "$(grep -Fo 'https://www12.a8.net/0.gif?a8mat=4BAEXC+G7GTMA+1SOW+ZQFQA' uru-mae-shindan/smartphone-pc-selling.html | wc -l)" -eq 1
          node .github/scripts/check-uru-mae-shindan-seo.mjs

      - name: Commit reviewed candidate files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-smartphone-adfree-canary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'スマホのIMEI・残債チェックを広告なしで追加'
          git push origin HEAD:aff/smartphone-network-adfree-canary-20260902
