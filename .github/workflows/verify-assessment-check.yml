name: Verify assessment check candidate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
      - name: Verify assessment page and static media
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          import xml.etree.ElementTree as ET

          root = Path('uru-mae-shindan')
          html_files = sorted(root.glob('*.html'))
          assert len(html_files) == 15, len(html_files)

          required = [
              'instrument-assessment-check.html',
              'instrument-selling.html',
              'assets/assessment-check.css',
              'assets/assessment-check.js',
              'assets/common.js',
              'assets/diagnosis.js',
              'assets/calculator.js',
              'sitemap.xml',
          ]
          for rel in required:
              assert (root / rel).is_file(), rel

          assessment = (root / 'instrument-assessment-check.html').read_text(encoding='utf-8')
          instrument = (root / 'instrument-selling.html').read_text(encoding='utf-8')
          script = (root / 'assets/assessment-check.js').read_text(encoding='utf-8')

          for marker in [
              '楽器買取の無料査定前チェック',
              '入力内容は外部送信なし',
              '本人または同一世帯',
              '30日以内に査定',
              'assets/assessment-check.js',
          ]:
              assert marker in assessment, marker

          assert 'instrument-assessment-check.html' in instrument
          assert '無料査定前チェック' in instrument
          assert 'new FormData(form)' in script
          assert "requiredNames = ['history', 'item', 'region', 'eligibleItem', 'deadline', 'method']" in script
          assert '<form' in assessment and 'action=' not in assessment

          prohibited = ('px.a8.net', 'media-console.a8.net', 'programId=s00000027408001')
          for marker in prohibited:
              assert marker not in assessment
              assert marker not in instrument

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == 'a' and values.get('href'):
                      self.links.append(values['href'])
                  if tag in ('link', 'script'):
                      ref = values.get('href') or values.get('src')
                      if ref:
                          self.links.append(ref)

          for page in html_files:
              parser = LinkParser()
              parser.feed(page.read_text(encoding='utf-8'))
              for href in parser.links:
                  if href.startswith(('#', 'mailto:', 'tel:')):
                      continue
                  parsed = urlparse(href)
                  if parsed.scheme in ('http', 'https'):
                      continue
                  target = (page.parent / parsed.path).resolve()
                  if parsed.path.endswith('/'):
                      target = target / 'index.html'
                  assert target.exists(), f'{page.name}: missing {href}'

          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          tree = ET.parse(root / 'sitemap.xml')
          urls = tree.findall('.//sm:url', ns)
          assert len(urls) == 14, len(urls)
          locations = [u.find('sm:loc', ns).text for u in urls]
          assert 'https://flhworks.github.io/flh.works/uru-mae-shindan/instrument-assessment-check.html' in locations

          print(f'STATIC_QA_PASS html={len(html_files)} sitemap_urls={len(urls)} assessment_check=PASS')
          PY
          node --check uru-mae-shindan/assets/common.js
          node --check uru-mae-shindan/assets/diagnosis.js
          node --check uru-mae-shindan/assets/calculator.js
          node --check uru-mae-shindan/assets/assessment-check.js
          echo NODE_JS_SYNTAX_PASS
