name: Verify live smartphone ad-free canary

on:
  push:
    branches:
      - aff/smartphone-network-adfree-canary-20260902
    paths:
      - '.github/workflows/verify-live-smartphone-adfree-canary.yml'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify live page, parent and sitemap
        shell: bash
        run: |
          set -euo pipefail
          base='https://flhworks.github.io/flh.works/uru-mae-shindan'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch_ready() {
            local url="$1"
            local file="$2"
            local marker="$3"
            local code=''
            for attempt in $(seq 1 24); do
              code="$(curl --silent --show-error --location --output "$file" --write-out '%{http_code}' "$url" || true)"
              echo "attempt=${attempt} url=${url} status=${code}"
              if [[ "$code" == '200' ]] && grep -Fq "$marker" "$file"; then
                return 0
              fi
              sleep 10
            done
            return 1
          }

          fetch_ready "$base/smartphone-network-restriction-before-selling.html" "$tmp/new.html" 'スマホを売る前のIMEI・残債・ネットワーク利用制限チェック'
          fetch_ready "$base/smartphone-pc-selling.html" "$tmp/parent.html" 'smartphone-network-restriction-before-selling.html'
          fetch_ready "$base/sitemap.xml" "$tmp/sitemap.xml" 'smartphone-network-restriction-before-selling.html'
          fetch_ready "$base/assets/high-intent.css" "$tmp/high-intent.css" '.fact-table-wrap'

          grep -Fq '<link href="https://flhworks.github.io/flh.works/uru-mae-shindan/smartphone-network-restriction-before-selling.html" rel="canonical"' "$tmp/new.html"
          grep -Fq 'content="index,follow,max-image-preview:large" name="robots"' "$tmp/new.html"
          ! grep -Eq 'a8mat=|px[.]a8[.]net|www[0-9]+[.]a8[.]net/0[.]gif|非公開候補|noindex' "$tmp/new.html"
          test "$(grep -Fo 'smartphone-network-restriction-before-selling.html' "$tmp/sitemap.xml" | wc -l)" -eq 1
          test "$(grep -Fo 'https://px.a8.net/svt/ejp?a8mat=4BAEXC+G7GTMA+1SOW+ZQFQA' "$tmp/parent.html" | wc -l)" -eq 1
          test "$(grep -Fo 'https://www12.a8.net/0.gif?a8mat=4BAEXC+G7GTMA+1SOW+ZQFQA' "$tmp/parent.html" | wc -l)" -eq 1

          echo 'SMARTPHONE_ADFREE_CANARY_LIVE=PASS'
