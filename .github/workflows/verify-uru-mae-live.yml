name: Verify uru-mae-shindan live site

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/verify-uru-mae-live.yml"

permissions:
  contents: read

jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify published pages and assets
        shell: bash
        run: |
          set -euo pipefail

          base="https://flhworks.github.io/flh.works/uru-mae-shindan"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch_until_live() {
            local url="$1"
            local output="$2"
            local status=""
            for attempt in $(seq 1 24); do
              status="$(curl --silent --show-error --location --output "$output" --write-out '%{http_code}' "$url" || true)"
              echo "attempt=${attempt} url=${url} status=${status}"
              if [[ "$status" == "200" ]]; then
                return 0
              fi
              sleep 10
            done
            echo "ERROR: ${url} did not return HTTP 200" >&2
            return 1
          }

          fetch_until_live "$base/" "$tmp/index.html"
          grep -Fq '<title>売る前診断</title>' "$tmp/index.html"
          grep -Fq 'その品、' "$tmp/index.html"
          grep -Fq '6つの質問で、向く売り方を整理' "$tmp/index.html"
          grep -Fq '現在、広告・アフィリエイトリンクは掲載していません。' "$tmp/index.html"

          pages=(
            about.html
            advertising-policy.html
            checklist.html
            compare.html
            editorial-policy.html
            flea-profit.html
            home-purchase.html
            privacy.html
            sources.html
            store-purchase.html
            visit-purchase.html
          )

          for page in "${pages[@]}"; do
            fetch_until_live "$base/$page" "$tmp/$page"
            grep -Fq '売る前診断' "$tmp/$page"
          done

          assets=(
            assets/styles.css
            assets/common.js
            assets/diagnosis.js
            assets/calculator.js
            assets/favicon.svg
          )

          for asset in "${assets[@]}"; do
            safe_name="${asset//\//_}"
            fetch_until_live "$base/$asset" "$tmp/$safe_name"
            test -s "$tmp/$safe_name"
          done

          grep -Fq 'function score()' "$tmp/assets_diagnosis.js"
          grep -Fq 'const cash=price-fee-shipping-packing-discount-transfer' "$tmp/assets_calculator.js"
          grep -Fq ':root {' "$tmp/assets_styles.css"

          unknown_status="$(curl --silent --show-error --location --output "$tmp/unknown.html" --write-out '%{http_code}' "$base/__verification_missing_page__" || true)"
          echo "unknown_path_status=${unknown_status}"
          [[ "$unknown_status" == "404" ]]

          echo "LIVE_VERIFIED_URL=$base/"
          echo "LIVE_VERIFIED_PAGES=12"
          echo "LIVE_VERIFIED_ASSETS=5"
          echo "LIVE_VERIFIED_AD_LINKS=0"
