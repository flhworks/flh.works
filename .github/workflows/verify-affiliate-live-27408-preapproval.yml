name: Verify affiliate live 27408 preapproval

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-live-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify published eligibility-aligned pages
        shell: bash
        run: |
          set -euo pipefail
          base="https://flhworks.github.io/flh.works/uru-mae-shindan"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch_until_live() {
            local url="$1"
            local output="$2"
            local marker="${3:-}"
            local status=""
            for attempt in $(seq 1 30); do
              status="$(curl --silent --show-error --location --output "$output" --write-out '%{http_code}' "$url" || true)"
              echo "attempt=${attempt} url=${url} status=${status}"
              if [[ "$status" == "200" ]]; then
                if [[ -z "$marker" ]] || grep -Fq "$marker" "$output"; then
                  return 0
                fi
              fi
              sleep 10
            done
            echo "ERROR: ${url} did not become live with expected content" >&2
            return 1
          }

          fetch_until_live "$base/instrument-selling.html" "$tmp/instrument.html" '査定サービスの対象外を先に確認'
          fetch_until_live "$base/checklist.html" "$tmp/checklist.html" '査定サービスごとに対象外があります。'
          fetch_until_live "$base/" "$tmp/index.html" '楽器・機材のガイドを見る'

          grep -Fq 'ピアノ関連、和楽器、オーディオ機器' "$tmp/instrument.html"
          grep -Fq 'シンセサイザー' "$tmp/instrument.html"
          grep -Fq '過去利用、同一世帯の重複申込み等の条件' "$tmp/instrument.html"
          grep -Fq '情報確認日：2026年8月25日' "$tmp/instrument.html"
          grep -Fq '<h2>楽器・DTM・DJ機材</h2>' "$tmp/checklist.html"
          grep -Fq '情報確認日：2026年8月25日' "$tmp/checklist.html"

          if grep -Fq '電子ピアノ・キーボード' "$tmp/instrument.html"; then
            echo 'ERROR: stale ineligible target text remains' >&2
            exit 1
          fi

          if grep -Eiq '(px\.a8\.net|media-console\.a8\.net|programId=s00000027408001)' "$tmp/index.html" "$tmp/instrument.html" "$tmp/checklist.html"; then
            echo 'ERROR: affiliate code or private program URL published before approval' >&2
            exit 1
          fi

          unknown_status="$(curl --silent --show-error --location --output "$tmp/unknown.html" --write-out '%{http_code}' "$base/__verification_missing_27408_preapproval__" || true)"
          echo "unknown_path_status=${unknown_status}"
          [[ "$unknown_status" == "404" ]]

          echo "LIVE_VERIFIED_URL=$base/"
          echo "LIVE_VERIFIED_ELIGIBILITY_ALIGNMENT=PASS"
          echo "LIVE_VERIFIED_AFFILIATE_LINKS=0"
